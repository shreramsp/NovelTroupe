# Shared look for both themes. The colours for each theme are in the light and dark sections below;
# the theme button in the app switches between them.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "8px"
showWidgetBorder = true

# Pine & brass on warm paper
[theme.light]
primaryColor = "#24594d"
backgroundColor = "#f4efe6"
secondaryBackgroundColor = "#eee8dc"
textColor = "#1c201e"
borderColor = "#e0d8c6"

# Sage on deep green-black
[theme.dark]
primaryColor = "#3a8a73"
backgroundColor = "#0f1412"
secondaryBackgroundColor = "#1e2622"
textColor = "#e9e6dc"
borderColor = "#2c3631"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
