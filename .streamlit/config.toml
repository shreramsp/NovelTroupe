[theme]
base = "light"
primaryColor = "#5046e5"
backgroundColor = "#f4f3ef"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#1d1c1a"
borderColor = "#e5e3dc"
showWidgetBorder = true
baseRadius = "10px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
